<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="omniroute field station. A little infrastructure, a lot to make. Harness to tailnet to gateway to providers."><title>omniroute field station</title><defs><pattern id="d" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".8" fill="#a6ad9c" fill-opacity=".45"/></pattern></defs><style>text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.m{font-family:'Cascadia Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace}.s{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400}.pulse{animation:p 2.6s ease-in-out infinite}.flow{stroke-dasharray:8 30;animation:f 1.8s linear infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}@keyframes f{to{stroke-dashoffset:-38}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="959" height="299" rx="10" fill="#eeede5" stroke="#aeb3a3"/><rect x="1" y="1" width="958" height="298" rx="10" fill="url(#d)"/><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fafaf4"/><stop offset="1" stop-color="#f0f1e8"/></linearGradient><clipPath id="c"><rect x=".5" y=".5" width="959" height="299" rx="10"/></clipPath></defs><g clip-path="url(#c)"><rect width="960" height="48" fill="url(#g)"/></g><path d="M1 48.5H959" stroke="#c9ccbd"/><rect x="24" y="13" width="22" height="22" fill="#eeede5" stroke="#242b25" stroke-width="2.2"/><rect x="31" y="20" width="8" height="8" fill="#e36336"/><text x="58" y="31" font-size="18" font-weight="700" letter-spacing="-.8" fill="#242b25">omniroute</text><text class="m" x="154" y="30" font-size="9" letter-spacing="1.6" fill="#63695e">FIELD STATION / 01</text><circle class="pulse" cx="754" cy="25" r="3.2" fill="#45684b"/><text class="m" x="936" y="29" font-size="9" letter-spacing="1.2" text-anchor="end" fill="#242b25">ILLUSTRATIVE · NO LIVE CALLS</text><text x="40" y="132" font-size="46" font-weight="600" letter-spacing="-2.5" fill="#242b25">A little</text><text x="40" y="184" font-size="46" font-weight="600" letter-spacing="-2.5" fill="#242b25"><tspan class="s" fill="#a83e1d" letter-spacing="-1.5">infrastructure.</tspan></text><text x="42" y="218" font-size="15" fill="#63695e">A lot to make.</text><text class="m" x="42" y="270" font-size="9" letter-spacing="1.8" fill="#242b25">HARNESS</text><text class="m" x="114.39999999999999" y="270" font-size="9" fill="#e36336">→</text><text class="m" x="140.39999999999998" y="270" font-size="9" letter-spacing="1.8" fill="#242b25">TAILNET</text><text class="m" x="212.79999999999995" y="270" font-size="9" fill="#e36336">→</text><text class="m" x="238.79999999999995" y="270" font-size="9" letter-spacing="1.8" fill="#242b25">GATEWAY</text><text class="m" x="311.19999999999993" y="270" font-size="9" fill="#e36336">→</text><text class="m" x="337.19999999999993" y="270" font-size="9" letter-spacing="1.8" fill="#242b25">PROVIDERS</text><g fill="none" stroke="#a4ae96" stroke-width="2.5"><path d="M492 166H540"/><path d="M660 166H716"/><path d="M716 166C736 166 736 114 760 114H800"/><path d="M716 166H800"/><path d="M716 166C736 166 736 218 760 218H800"/></g><g fill="none" stroke="#e36336" stroke-width="3.5" stroke-linecap="round" class="flow"><path d="M492 166H540"/><path d="M660 166H716"/><path d="M716 166H800"/></g><text class="m" x="372" y="78" font-size="8" letter-spacing="1" fill="#63695e">01 / YOUR MACHINE</text><text class="m" x="552" y="78" font-size="8" letter-spacing="1" fill="#63695e">02 / CLOUD</text><text class="m" x="800" y="78" font-size="8" letter-spacing="1" fill="#63695e">03 / PROVIDERS</text><rect x="372" y="140" width="120" height="64" rx="5" fill="#c4cbb5" stroke="#89927b"/><rect x="372" y="134" width="120" height="64" rx="5" fill="#e3e6d5" stroke="#9fa68f"/><text x="394" y="168.0" font-size="19" font-weight="600" letter-spacing="-.6" fill="#242b25">Harness</text><text class="m" x="394"